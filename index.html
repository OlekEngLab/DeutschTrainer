<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Deutsch Trainer – v5</title><style>
:root{--bg:#f5f6f8;--card:#fff;--text:#202733;--muted:#687386;--line:#d8dde5;--blue:#2563eb;--green:#16a34a;--yellow:#eab308;--red:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.app{max-width:760px;margin:auto;padding:16px}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}h1{font-size:24px;margin:0}.sub{font-size:14px;color:var(--muted);margin-top:3px}button{border:0;border-radius:10px;padding:11px 15px;font-size:16px;background:#e9edf3;color:var(--text);cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--blue);color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 3px 12px #00000009}.progress{height:8px;background:#e5e7eb;border-radius:8px;overflow:hidden;margin:10px 0 16px}.bar{height:100%;width:0;background:var(--blue);transition:.25s}.mode{text-align:center;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.04em}.word{font-size:38px;font-weight:700;text-align:center;margin:18px 0}.translation{text-align:center;font-size:20px;margin:8px 0 20px}.level{display:inline-block;padding:4px 8px;border-radius:12px;background:#eef2ff;color:#3730a3;font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:14px}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;font-size:19px;outline:none}input:focus{border-color:var(--blue)}.feedback{text-align:center;font-weight:700;min-height:27px;margin-top:12px}.hint{text-align:center;color:var(--muted);font-size:14px;margin-top:12px;line-height:1.45}.level-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0}.level-btn{padding:16px;font-weight:700}.level-btn small{display:block;font-weight:400;color:var(--muted);margin-top:5px}.word-list{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}.word-tile{min-height:72px;border:1px solid var(--line);border-radius:12px;padding:9px 6px;display:flex;flex-direction:column;justify-content:center;align-items:center}.word-tile .de{font-weight:700;font-size:16px}.word-tile .ru{font-size:12px;margin-top:4px;color:#4b5563}.word-tile.greenish{background:#fff}.word-tile.red{background:#fee2e2;border-color:#fca5a5}.word-tile.yellow{background:#fef3c7;border-color:#fcd34d}.word-tile.green{background:#dcfce7;border-color:#86efac}.legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--muted)}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.dot.red{background:#ef4444}.dot.yellow{background:#eab308}.dot.green{background:#22c55e}.sentence{min-height:56px;border:2px dashed var(--line);border-radius:10px;padding:9px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:12px}.sentence.goodline{border-color:var(--green);background:#f0fdf4}.sentence.badline{border-color:var(--red);background:#fef2f2}.chosen{background:#dbeafe;border:1px solid #93c5fd;padding:8px 10px;border-radius:8px}.tokens{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:17px 0}.token{padding:9px 11px}.hidden{display:none!important}.help{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:11px 13px;margin-top:12px;text-align:center}.summary{text-align:center}.score{font-size:42px;font-weight:700;margin:10px}.small{font-size:13px;color:var(--muted)}@media(max-width:520px){.app{padding:12px}.word-list{gap:7px}.word-tile .de{font-size:14px}.word-tile .ru{font-size:11px}}
</style></head><body><div class="app"><header><div><h1>Deutsch Trainer</h1><div class="sub">v5 · <b>machen & Präfixe</b></div></div><button id="globalSpeak">🔊</button></header><div class="progress"><div class="bar" id="bar"></div></div><div id="card" class="card"></div></div><script>
const D={id:'machen-praefixe-v5',title:'machen & Präfixe',words:[
['machen',['делать'],'совершать действие; выполнять что-либо'],['anmachen',['включать','зажигать'],'привести свет, прибор или огонь в рабочее состояние'],['ausmachen',['выключать','договариваться'],'прекратить работу прибора или договориться'],['aufmachen',['открывать'],'сделать закрытое доступным для входа или использования'],['zumachen',['закрывать'],'сделать открытое снова закрытым'],['mitmachen',['участвовать','присоединяться'],'делать что-либо вместе с другими'],['abmachen',['договариваться','снимать','отсоединять'],'договориться о чём-либо или снять/отсоединить предмет'],['nachmachen',['повторять','подражать','копировать'],'делать так же, как другой человек'],['weitermachen',['продолжать'],'не прекращать действие и делать его дальше']].map(x=>({de:x[0],ru:x[1],help:x[2]})),sentences:[
['machen','A1','Ich mache heute die Hausaufgaben.','Я сегодня делаю домашнее задание.'],['machen','A2','Was möchtest du am Wochenende machen?','Что ты хочешь делать на выходных?'],['machen','B1','Bevor wir eine Entscheidung treffen, müssen wir uns klar machen, was wirklich wichtig ist.','Прежде чем принять решение, мы должны осознать, что действительно важно.'],
['anmachen','A1','Ich mache das Licht an.','Я включаю свет.'],['anmachen','A2','Kannst du bitte den Computer anmachen?','Можешь, пожалуйста, включить компьютер?'],['anmachen','B1','Er hat das Radio angemacht, damit wir während der Arbeit Musik hören können.','Он включил радио, чтобы мы могли слушать музыку во время работы.'],
['ausmachen','A1','Mach bitte das Licht aus.','Пожалуйста, выключи свет.'],['ausmachen','A2','Wir müssen noch ausmachen, wann wir uns treffen.','Нам ещё нужно договориться, когда мы встретимся.'],['ausmachen','B1','Wir haben ausgemacht, dass jeder seine Aufgabe bis Freitag erledigt.','Мы договорились, что каждый выполнит свою задачу до пятницы.'],
['aufmachen','A1','Mach bitte die Tür auf.','Пожалуйста, открой дверь.'],['aufmachen','A2','Kannst du das Fenster aufmachen?','Можешь открыть окно?'],['aufmachen','B1','Sie machte vorsichtig die Schachtel auf, weil sie nicht wusste, was darin war.','Она осторожно открыла коробку, потому что не знала, что в ней.'],
['zumachen','A1','Mach bitte die Tür zu.','Пожалуйста, закрой дверь.'],['zumachen','A2','Kannst du das Fenster zumachen?','Можешь закрыть окно?'],['zumachen','B1','Bitte mach das Fenster zu, bevor du das Zimmer verlässt.','Пожалуйста, закрой окно, прежде чем покинешь комнату.'],
['mitmachen','A1','Machst du mit?','Ты участвуешь?'],['mitmachen','A2','Ich möchte bei dem Spiel mitmachen.','Я хочу участвовать в игре.'],['mitmachen','B1','Obwohl er wenig Zeit hatte, wollte er bei dem Projekt mitmachen.','Хотя у него было мало времени, он хотел участвовать в проекте.'],
['abmachen','A1','Wir machen einen Termin ab.','Мы договариваемся о встрече.'],['abmachen','A2','Wir haben einen Termin für Freitag abgemacht.','Мы договорились о встрече на пятницу.'],['abmachen','B1','Wir sollten vorher genau abmachen, wer welche Aufgabe übernimmt.','Нам следует заранее точно договориться, кто какую задачу берёт на себя.'],
['nachmachen','A1','Das Kind macht seinen Vater nach.','Ребёнок подражает своему отцу.'],['nachmachen','A2','Kinder machen oft nach, was Erwachsene tun.','Дети часто повторяют то, что делают взрослые.'],['nachmachen','B1','Wer immer nur nachmacht, was andere machen, entwickelt kaum eine eigene Lösung.','Тот, кто постоянно лишь повторяет за другими, почти не создаёт собственного решения.'],
['weitermachen','A1','Wir machen weiter.','Мы продолжаем.'],['weitermachen','A2','Nach der Pause machen wir weiter.','После перерыва мы продолжаем.'],['weitermachen','B1','Obwohl die Arbeit schwierig war, haben wir weitergemacht, bis alles fertig war.','Хотя работа была сложной, мы продолжали, пока всё не было готово.']].map(x=>({word:x[0],level:x[1],de:x[2],ru:x[3]}))};
const R={A1:1,A2:2,B1:3,B2:4};
const DEFAULT=D;
const PROGRESS_KEY='deutschTrainer_progress_v6';
let progress=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}');
let dictionaries=[DEFAULT], current=null, level=null, wi=-1, ss=[], sp=0, selected=[], score=0, step=0, moduleStats=null, helpUsed=false;
function saveProgress(){localStorage.setItem(PROGRESS_KEY,JSON.stringify(progress))}
function pkey(w){return current.id+'::'+w.de}
function st(w){return progress[pkey(w)]||{attempts:0,errors:0,completed:0,help:0,lastLevel:null,lastCompleted:null}}
function setbar(p){document.getElementById('bar').style.width=Math.max(0,Math.min(100,p))+'%'}
function esc(s){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
function speak(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.84;speechSynthesis.speak(u)}
function status(w){let s=st(w);return !s.completed?'red':(s.errors||s.help)?'yellow':'green'}
function home(){current=null;level=null;wi=-1;document.getElementById('card').innerHTML='<div class="mode">Meine Wörterbücher</div><div class="word" style="font-size:30px">Выберите словарь</div><div class="word-list">'+dictionaries.map((d,i)=>{let done=d.words.filter(w=>stFor(d,w).completed).length;return '<button class="word-tile" onclick="chooseDict('+i+')"><span class="de">'+esc(d.title||d.id)+'</span><span class="ru">'+d.words.length+' Wörter · '+done+'/'+d.words.length+'</span></button>'}).join('')+'</div><div class="actions"><button class="primary" onclick="document.getElementById(\'fileInput\').click()">📚 Загрузить словарь</button><button onclick="clearAll()">Сбросить весь прогресс</button></div><div class="hint">Словари не сохраняются приложением. Прогресс хранится отдельно по уникальному ID словаря.</div><input id="fileInput" class="hidden" type="file" accept=".json,application/json" onchange="importDict(event)">';setbar(0)}
function stFor(d,w){return progress[d.id+'::'+w.de]||{attempts:0,errors:0,completed:0,help:0,lastLevel:null,lastCompleted:null}}
function chooseDict(i){current=dictionaries[i];levels()}
function levels(){level=null;wi=-1;document.getElementById('card').innerHTML='<div class="mode">'+esc(current.title||current.id)+'</div><div class="word" style="font-size:30px">Выберите сложность</div><div class="level-grid"><button class="level-btn" onclick="choose(\'A1\')">A1<small>Grundlagen</small></button><button class="level-btn" onclick="choose(\'A2\')">A2<small>Alltag</small></button><button class="level-btn" onclick="choose(\'B1\')">B1<small>Zusammenhänge</small></button><button class="level-btn" onclick="choose(\'B2\')">B2<small>Komplexere Sätze</small></button></div><div class="actions"><button onclick="home()">← К словарям</button></div>';setbar(0)}
function choose(l){level=l;words()}
function words(){let done=current.words.filter(w=>st(w).completed).length;document.getElementById('card').innerHTML='<div class="mode">'+esc(current.title||current.id)+' · '+level+'</div><div class="word" style="font-size:28px">Выберите слово</div><div class="word-list">'+current.words.map((w,i)=>'<button class="word-tile '+status(w)+'" onclick="start('+i+')"><span class="de">'+esc(w.de)+'</span><span class="ru">'+w.ru.map(esc).join(' / ')+'</span></button>').join('')+'</div><div class="legend"><span><i class="dot red"></i>не изучено</span><span><i class="dot yellow"></i>ошибки/помощь</span><span><i class="dot green"></i>завершено</span></div><div class="actions"><button onclick="levels()">Сменить уровень</button><button onclick="home()">К словарям</button><button onclick="resetDict()">Сбросить прогресс словаря</button></div><div class="hint">Изучено: '+done+' из '+current.words.length+'. Перехода к следующему слову автоматически нет.</div>';setbar(done/current.words.length*100)}
function resetDict(){if(!confirm('Сбросить прогресс только этого словаря?'))return;current.words.forEach(w=>delete progress[pkey(w)]);saveProgress();words()}
function clearAll(){if(!confirm('Сбросить прогресс всех словарей?'))return;progress={};saveProgress();home()}
function start(i){wi=i;sp=0;selected=[];score=0;step=0;helpUsed=false;moduleStats={attempts:0,errors:0,help:0};let w=current.words[i],pool=(current.sentences||[]).filter(s=>s.word===w.de&&R[s.level]<=R[level]);if(pool.length<3)pool=(current.sentences||[]).filter(s=>s.word===w.de);ss=[...pool].sort(()=>Math.random()-.5).slice(0,3);word('de');setbar(0)}
function word(dir){let w=current.words[wi],ask=dir==='ru';document.getElementById('card').innerHTML='<div class="mode">'+(ask?'2. Русский → Deutsch':'1. Deutsch → русский')+' <span class="level">'+level+'</span></div><div class="word">'+(ask?esc(w.ru[0]):esc(w.de))+'</div><input id="ans" lang="'+(ask?'de':'ru')+'" inputmode="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="'+(ask?'Введите немецкое слово':'Введите перевод')+'"><div class="actions"><button class="primary" id="check">Проверить</button><button onclick="help()">💡 Помощь</button><button onclick="speak('+JSON.stringify(w.de)+')">🔊 Слушать</button></div><div id="hp" class="help hidden"></div><div id="fb" class="feedback"></div><div class="hint">Поле ввода: <b>'+(ask?'Deutsch':'Русский')+'</b>.</div>';let a=document.getElementById('ans');a.focus();a.onkeydown=e=>{if(e.key==='Enter')check(dir)};document.getElementById('check').onclick=()=>check(dir)}
function norm(s){return s.toLowerCase().trim().replace(/[.,!?;:]/g,'').replace(/ё/g,'е').replace(/\s+/g,' ')}
function check(dir){let w=current.words[wi],v=norm(document.getElementById('ans').value),a=dir==='ru'?[w.de]:w.ru,ok=a.some(x=>norm(x)===v);moduleStats.attempts++;if(!ok)moduleStats.errors++;let f=document.getElementById('fb');f.innerHTML=ok?'✓ Richtig!':'✗ Допустимые варианты: <b>'+a.map(esc).join(' / ')+'</b>';f.style.color=ok?'var(--green)':'var(--red)';step++;let b=document.getElementById('check');b.textContent='Далее';b.onclick=()=>dir==='de'?word('ru'):sentence();setbar(step/5*100)}
function help(){let w=current.words[wi];if(!helpUsed){moduleStats.help++;helpUsed=true}let b=document.getElementById('hp');b.classList.remove('hidden');b.innerHTML='<b>💡 Hilfe:</b> '+esc(w.help||'Подсказка отсутствует.')+'<br><button style="margin-top:8px" onclick="answer()">Показать ответ</button>'}
function answer(){document.getElementById('hp').innerHTML='<b>Ответ:</b> '+current.words[wi].ru.map(esc).join(' / ')}
function sentence(){if(!ss[sp]){finish();return}let s=ss[sp],ts=s.de.replace(/[.,!?]/g,'').split(' ').sort(()=>Math.random()-.5);selected=[];document.getElementById('card').innerHTML='<div class="mode">3. Составьте предложение <span class="level">'+s.level+'</span></div><div class="translation">'+esc(s.ru)+'</div><div id="sent" class="sentence"><span class="small">Нажимайте на слова ниже →</span></div><div class="tokens">'+ts.map(t=>'<button class="token">'+esc(t)+'</button>').join('')+'</div><div class="actions"><button class="primary" id="sb">Проверить</button><button onclick="undo()">← Убрать последнее</button><button onclick="sentence()">Сбросить всё</button><button onclick="speak('+JSON.stringify(s.de)+')">🔊 Слушать</button></div><div id="fb" class="feedback"></div>';document.querySelectorAll('.token').forEach(b=>b.onclick=()=>{if(b.disabled)return;b.disabled=true;selected.push(b.textContent);draw()});document.getElementById('sb').onclick=checkS;setbar((2+sp)/5*100)}
function draw(){let b=document.getElementById('sent');b.innerHTML=selected.length?selected.map(x=>'<span class="chosen">'+esc(x)+'</span>').join(''):'<span class="small">Нажимайте на слова ниже →</span>'}
function undo(){if(!selected.length)return;let t=selected.pop();draw();let bs=[...document.querySelectorAll('.token')];for(let i=bs.length-1;i>=0;i--)if(bs[i].disabled&&bs[i].textContent===t){bs[i].disabled=false;break}}
function checkS(){let s=ss[sp],ok=selected.join(' ')===s.de.replace(/[.,!?]/g,''),f=document.getElementById('fb'),b=document.getElementById('sb');moduleStats.attempts++;if(!ok)moduleStats.errors++;f.innerHTML=ok?'✓ Richtig!':'✗ Правильный порядок: <b>'+esc(s.de)+'</b>';f.style.color=ok?'var(--green)':'var(--red)';if(!ok){b.textContent='Повторить';b.onclick=sentence;return}score++;b.textContent=sp<2?'Следующее предложение':'Завершить';b.onclick=()=>{sp++;sp<3?sentence():finish()}}
function finish(){let w=current.words[wi],k=pkey(w),old=st(w);progress[k]={attempts:old.attempts+moduleStats.attempts,errors:old.errors+moduleStats.errors,completed:old.completed+1,help:old.help+moduleStats.help,lastLevel:level,lastCompleted:new Date().toISOString()};saveProgress();moduleStats=null;document.getElementById('card').innerHTML='<div class="summary"><div class="mode">Modul abgeschlossen</div><div class="word">'+esc(w.de)+'</div><div class="score">'+score+'/5</div><p><b>Серия завершена. Прогресс сохранён.</b></p><div class="actions"><button class="primary" onclick="words()">К 9 словам</button><button onclick="start('+wi+')">Повторить слово</button></div></div>';setbar(100)}
function validate(d){if(!d||typeof d!=='object')throw Error('Файл должен быть JSON-объектом.');if(!d.id||!d.title)throw Error('Нужны id и title.');if(!Array.isArray(d.words)||d.words.length!==9)throw Error('Нужно ровно 9 слов.');if(!Array.isArray(d.sentences))throw Error('Нет массива sentences.');let seen=new Set();for(let w of d.words){if(!w.de||seen.has(w.de))throw Error('Пустое или повторяющееся слово: '+w.de);seen.add(w.de);if(!Array.isArray(w.ru)||!w.ru.length)throw Error('Нет переводов: '+w.de);if(typeof w.help!=='string')throw Error('Нет help: '+w.de);let ss=d.sentences.filter(s=>s.word===w.de);if(ss.length!==3)throw Error('Для '+w.de+' должно быть 3 предложения.');for(let s of ss)if(!R[s.level]||!s.de||!s.ru)throw Error('Некорректное предложение: '+w.de)}}
async function importDict(e){let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());validate(d);let i=dictionaries.findIndex(x=>x.id===d.id);if(i>=0)dictionaries[i]=d;else dictionaries.push(d);alert('Словарь загружен: '+d.title);home()}catch(err){alert('Ошибка загрузки словаря:\n'+err.message)}e.target.value=''}
document.getElementById('globalSpeak').onclick=()=>{if(current&&wi>=0)speak(current.words[wi].de)};home();
</script></body></html>
